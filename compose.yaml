services:
  app:
    build: .
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      # 강의용 취약점 스위치. 1이면 뚫리는 버전, 0(기본)이면 정상 버전.
      VULN: "${VULN:-0}"
    restart: unless-stopped

  caddy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
