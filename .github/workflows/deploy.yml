name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            cd test_proj
            git pull
            # 강의 실습용 취약 버전으로 배포한다.
            # 정상 버전으로 되돌리려면 VULN=0 으로 바꾸고 다시 푸시하면 된다.
            VULN=1 docker compose up -d --build